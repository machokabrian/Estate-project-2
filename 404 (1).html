<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Senator Kondo Properties</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fbf8f4;color:#2a2018;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(70px,18vw,140px);line-height:1;color:#b9741a}
h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,5vw,30px);margin:8px 0}
p{color:#7a6d63;margin:10px 0 26px}
a{display:inline-block;background:linear-gradient(135deg,#f3c874,#d28f2f);color:#1c1411;text-decoration:none;font-weight:700;padding:13px 26px;border-radius:12px;box-shadow:0 8px 22px #d28f2f55}
</style>
<script>
// A property page that isn't built yet (new listing) or was removed: go to the home page, which opens it if it exists.
(function(){var m=location.pathname.match(/^(.*)\/property\/(\d+)(?:-[^\/]*)?\/?$/);if(m)location.replace((m[1]||"")+"/#listing-"+m[2]);})();
</script>
</head>
<body>
<main>
  <h1>404</h1>
  <h2>We couldn't find that page</h2>
  <p>It may have moved, or the property may no longer be listed.</p>
  <a href="/">Browse properties</a>
</main>
</body>
</html>
