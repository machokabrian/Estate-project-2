<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Listing Manager</title>
<style>
:root{--brown:#1c1411;--gold:#d28f2f;--bg:#f6f1ea;--mut:#7a6d63}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#2a2018;line-height:1.5}
header{background:var(--brown);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:18px}
.wrap{max-width:1200px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.2fr);gap:18px;align-items:start}
.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}
.panel h2{font-size:17px;margin-bottom:10px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.b{background:var(--gold);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.b.o{background:none;border:2px solid var(--gold);color:var(--brown)}
.b.s{padding:5px 10px;font-size:13px}
.b.d{background:#b83b3b}
header .b.o{color:#fff;border-color:#fff}
input,select,textarea{width:100%;padding:9px;border:1px solid #d9cdc0;border-radius:8px;background:#fff}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee5db}
.item img{width:64px;height:48px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mut)}
.badge{font-size:11px;background:#eee5db;border-radius:10px;padding:1px 8px;margin-left:4px}
.photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ph{width:110px;font-size:12px;text-align:center}
.ph img{width:110px;height:80px;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}
.ph button{margin:1px}
.note{background:#fff7e6;border:1px solid #f0d9a8;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1411;color:#fff;padding:10px 18px;border-radius:10px;z-index:9;display:none}
#dirty{font-size:12px;color:#ffd48a}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🏡 Listing Manager</h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span id="dirty"></span>
    <button class="b o s" id="importBtn">Import listings.js</button>
    <button class="b o s" id="jsOnly">Download listings.js only</button>
    <button class="b s" id="dlZip">⬇ Download site update (.zip)</button>
  </div>
  <input type="file" id="importFile" accept=".js,.json,text/javascript,application/json" hidden>
</header>

<div class="wrap">
  <section class="panel">
    <div class="note"><b>How it works:</b> add or edit listings here, then tap <b>Download site update</b>. Unzip it into your website folder (replace the existing files) and upload the folder to your hosting. Your changes are saved in this browser until you clear it.</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h2 id="count">Listings</h2>
      <button class="b s" id="addNew">+ Add listing</button>
    </div>
    <div id="list"></div>
  </section>

  <section class="panel">
    <h2 id="formTitle">Add a listing</h2>
    <form id="f">
      <label for="title">Title *</label><input id="title" required maxlength="100" placeholder="e.g. 3-Bedroom Bungalow">
      <div class="row">
        <div><label for="type">Type *</label><select id="type"><option>House</option><option>Apartment</option><option>Land</option><option>Commercial</option></select></div>
        <div><label for="purpose">For *</label><select id="purpose"><option value="Sale">Sale</option><option value="Rent">Rent</option></select></div>
      </div>
      <div class="row">
        <div><label for="status">Status</label><select id="status"><option value="available">Available</option><option value="reserved">Reserved</option><option value="sold">Sold</option><option value="let">Let</option></select></div>
        <div><label for="featured">Featured (shown first)</label><select id="featured"><option value="0">No</option><option value="1">Yes</option></select></div>
      </div>
      <label for="loc">Location *</label><input id="loc" required maxlength="120" placeholder="e.g. Karen, Nairobi">
      <div class="row">
        <div><label for="price">Price (KSh) * <small>(per month if renting)</small></label><input id="price" type="number" min="0" required></div>
        <div><label for="beds">Bedrooms</label><input id="beds" type="number" min="0" max="20" value="0"></div>
      </div>
      <label for="size">Size</label><input id="size" maxlength="60" placeholder="e.g. 0.25 acre or 120 m²">
      <label for="desc">Description</label><textarea id="desc" rows="4" maxlength="1000"></textarea>
      <label for="amen">Features <small>(one per line)</small></label><textarea id="amen" rows="4" placeholder="Borehole&#10;Parking for 2 cars&#10;24-hour security"></textarea>

      <label>Photos <small>(the first one is the cover)</small></label>
      <input type="file" id="files" accept="image/*" multiple>
      <div style="display:flex;gap:8px;margin-top:6px"><input id="urlIn" placeholder="…or paste a photo link"><button type="button" class="b o s" id="urlAdd">Add link</button></div>
      <div class="photos" id="photos"></div>

      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="b" type="submit">Save listing</button>
        <button class="b o" type="button" id="cancel">Cancel</button>
      </div>
    </form>
  </section>
</div>
<div class="toast" id="toast"></div>

<!-- Your current listings (optional – missing the first time) -->
<script src="listings.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "sk_admin_draft_v1";
let L = [], cur = null, dirty = false;

/* ---------- helpers ---------- */
const toast = m => { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2800); };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "listing";
const setDirty = v => { dirty = v; $("dirty").textContent = v ? "● Changes not downloaded yet" : ""; };
const norm = p => ({
  id:p.id, title:p.title||"", type:p.type||"House", purpose:p.purpose||"Sale", status:p.status||"available",
  loc:p.loc||"", price:+p.price||0, beds:+p.beds||0, featured:+!!p.featured, size:p.size||"", desc:p.desc||"",
  amenities:p.amenities||[], imgs:(p.imgs||[]).map(x => typeof x === "string" ? {src:x} : x)
});
const photoSrc = x => x.data || (/[./]/.test(x.src) ? x.src : `https://images.unsplash.com/${x.src}?auto=format&fit=crop&w=300&q=60`);
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(L)); }
  catch(e){ toast("Draft too large to autosave in this browser. Download your update regularly."); }
}

/* ---------- list ---------- */
function renderList(){
  $("count").textContent = `Listings (${L.length})`;
  $("list").innerHTML = L.length ? L.map(p => `
    <div class="item">
      <img src="${p.imgs[0] ? photoSrc(p.imgs[0]) : ""}" alt="">
      <div class="t"><b>${esc(p.title)}</b><small>${esc(p.loc)} · KSh ${p.price.toLocaleString()}${p.purpose==="Rent"?"/mo":""}</small><span class="badge">${p.status}</span>${p.featured?'<span class="badge">★</span>':""}</div>
      <button class="b o s" data-e="${p.id}">Edit</button><button class="b o s" data-c="${p.id}">Copy</button><button class="b d s" data-d="${p.id}">Delete</button>
    </div>`).join("") : "<p style='color:var(--mut)'>No listings yet. Add your first one.</p>";
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("list").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.e) edit(+b.dataset.e);
  if(b.dataset.c){ const p = JSON.parse(JSON.stringify(L.find(x => x.id === +b.dataset.c))); p.id = nextId(); p.title += " (copy)"; L.push(p); persist(); setDirty(true); renderList(); edit(p.id); }
  if(b.dataset.d && confirm("Delete this listing?")){ L = L.filter(x => x.id !== +b.dataset.d); if(cur && cur.id === +b.dataset.d) startNew(); persist(); setDirty(true); renderList(); }
};
const nextId = () => L.reduce((m,p) => Math.max(m,p.id), 0) + 1;

/* ---------- form ---------- */
const fields = ["title","type","purpose","status","featured","loc","price","beds","size","desc"];
function fill(p){
  fields.forEach(k => $(k).value = p[k]);
  $("amen").value = p.amenities.join("\n");
  renderPhotos();
}
function startNew(){ cur = norm({id:null}); $("formTitle").textContent = "Add a listing"; fill(cur); }
function edit(id){ cur = JSON.parse(JSON.stringify(L.find(x => x.id === id))); $("formTitle").textContent = "Edit listing"; fill(cur); scrollTo({top:0, behavior:"smooth"}); }
$("addNew").onclick = startNew; $("cancel").onclick = startNew;

$("f").onsubmit = e => {
  e.preventDefault();
  fields.forEach(k => cur[k] = ["price","beds","featured"].includes(k) ? +$(k).value || 0 : $(k).value.trim());
  cur.amenities = $("amen").value.split("\n").map(s => s.trim()).filter(Boolean);
  if(cur.id == null){ cur.id = nextId(); L.push(cur); }
  else L = L.map(p => p.id === cur.id ? cur : p);
  persist(); setDirty(true); renderList(); toast("Saved. Now download your site update."); startNew();
};

/* ---------- photos ---------- */
function renderPhotos(){
  $("photos").innerHTML = cur.imgs.map((x,i) => `
    <div class="ph"><img src="${photoSrc(x)}" alt="">
      ${i ? `<button type="button" class="b o s" data-cover="${i}">Make cover</button>` : "<b>★ Cover</b><br>"}
      <button type="button" class="b d s" data-rm="${i}">Remove</button></div>`).join("");
}
$("photos").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.rm) cur.imgs.splice(+b.dataset.rm, 1);
  if(b.dataset.cover) cur.imgs.unshift(cur.imgs.splice(+b.dataset.cover, 1)[0]);
  renderPhotos();
};
function compress(file, max = 1200, q = .75){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      im.onerror = () => rej(new Error("unsupported image")); im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
$("files").onchange = async e => {
  for(const f of e.target.files){
    try{
      const data = await compress(f);
      cur.imgs.push({data, name:`${slug($("title").value || "listing")}-${Date.now().toString(36)}-${cur.imgs.length+1}.jpg`});
    }catch(err){ toast(`Couldn't read ${f.name}. Try a JPG or PNG.`); }
  }
  e.target.value = ""; renderPhotos();
};
$("urlAdd").onclick = () => { const v = $("urlIn").value.trim(); if(v){ cur.imgs.push({src:v}); $("urlIn").value = ""; renderPhotos(); } };

/* ---------- export ---------- */
function exportList(){
  const newImgs = [];
  const out = L.map(p => ({
    id:p.id, title:p.title, type:p.type, purpose:p.purpose, status:p.status, loc:p.loc, price:p.price, beds:p.beds,
    featured:p.featured, size:p.size, desc:p.desc, amenities:p.amenities,
    imgs:p.imgs.map(x => { if(x.data){ newImgs.push(x); return "images/" + x.name; } return x.src; })
  }));
  const js = "// Generated by admin.html on " + new Date().toLocaleString() + ". Edit your listings with admin.html instead of by hand.\nwindow.LISTINGS = " + JSON.stringify(out, null, 1) + ";\n";
  return {js, newImgs};
}
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/*ZIP*/
const crcTable = (() => { const t = []; for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for(let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files){          // files: [{name, data:Uint8Array}] – stored, no compression
  const enc = new TextEncoder(), parts = [], central = [];
  const u16 = n => [n & 255, (n >> 8) & 255], u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const local = new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0)]);
    parts.push(local, name, f.data);
    central.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
    offset += local.length + name.length + size;
  });
  const cdSize = central.reduce((a,b) => a + b.length, 0);
  const end = new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  return new Blob([...parts, ...central, end], {type:"application/zip"});
}
/*ENDZIP*/
const dataToBytes = d => Uint8Array.from(atob(d.split(",")[1]), c => c.charCodeAt(0));

$("dlZip").onclick = () => {
  const {js, newImgs} = exportList(), enc = new TextEncoder();
  const files = [{name:"listings.js", data:enc.encode(js)}, ...newImgs.map(x => ({name:"images/" + x.name, data:dataToBytes(x.data)}))];
  download(makeZip(files), "site-update.zip");
  persist(); setDirty(false); toast("Unzip into your website folder and upload it.");
};
$("jsOnly").onclick = () => {
  const {js, newImgs} = exportList();
  if(newImgs.length && !confirm("You have new photos. They are only included in the .zip download. Download listings.js only anyway?")) return;
  download(new Blob([js], {type:"text/javascript"}), "listings.js"); setDirty(false);
};

/* ---------- import ---------- */
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const txt = await f.text();
    const arr = JSON.parse(txt.replace(/^[^=\[]*=\s*/, "").replace(/;\s*$/, ""));
    if(!Array.isArray(arr)) throw 0;
    if(L.length && !confirm("Replace the listings you're editing with this file?")) return;
    L = arr.map(norm); persist(); setDirty(false); renderList(); startNew(); toast(`Imported ${L.length} listings.`);
  }catch(err){ toast("That file isn't a valid listings.js."); }
  e.target.value = "";
};
addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- start ---------- */
(function init(){
  let draft = null;
  try{ draft = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  if(Array.isArray(draft)){ L = draft.map(norm); setDirty(false); }
  else L = (window.LISTINGS || []).map(norm);
  renderList(); startNew();
})();
</script>
</body>
</html>
